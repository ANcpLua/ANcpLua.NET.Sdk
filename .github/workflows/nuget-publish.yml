name: publish
on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NUGET_DIRECTORY: ${{ github.workspace}}/artifacts

defaults:
  run:
    shell: pwsh

jobs:
  lint_config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Create artifacts directory
        run: mkdir -p artifacts
      - run: dotnet run --project=tools/ConfigFilesGenerator/ConfigFilesGenerator.csproj
      - name: Check for changes
        id: check_changes
        run: |
          # Deliberately NOT `git diff --exit-code`. GitHub wraps every pwsh step as
          # `. 'script.ps1'` and appends `exit $LASTEXITCODE`, so a git command that exits 1
          # to signal "there is a diff" fails the whole step *after* the output is set —
          # which is why this gate could never reach the commit step below and had to be
          # healed by hand (Roslyn 5.9 adding IDE0410, 2026-08-27).
          # `git status --porcelain` reports the same drift while always exiting 0, and it
          # also lists untracked files, which `git diff` misses but `git add -A` would commit.
          $changes = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Generated config files are up to date."
            "has_changes=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Generated config files drifted:"
            Write-Host $changes
            "has_changes=true" >> $env:GITHUB_OUTPUT
          }
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true' && github.repository == 'ANcpLua/ANcpLua.NET.Sdk'
        env:
          # Via env, never interpolated into the script body: head_ref is the PR author's
          # branch name and a fork can name a branch almost anything, so `${{ }}` inline
          # would be a script-injection sink.
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update configuration files"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed" }

          # Push by explicit refspec: `ref:` above checks out a branch name, but a bare
          # `git push` still needs the branch to have an upstream. Retry on rejection so a
          # concurrent merge into the branch doesn't turn a self-heal into a red build.
          $branch = $env:BRANCH
          foreach ($attempt in 1..3) {
            git push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Pushed regenerated config files to $branch."
              exit 0
            }
            Write-Host "Push rejected (attempt $attempt of 3) - rebasing onto origin/$branch"
            git fetch origin $branch
            if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
            git rebase "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw "git rebase failed - resolve the config drift by hand" }
          }
          throw "Could not push regenerated config files after 3 attempts"

  compute_version:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.compute-version.outputs.package_version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: compute-version
        run: |
            $LatestTag = git describe --tags --abbrev=0 2>$null
            if ($LatestTag -and $LatestTag -match '^v([0-9]+)\.([0-9]+)\.([0-9]+)$')
            {
                $Major = [int]$Matches[1]
                $Minor = [int]$Matches[2]
                $Patch = [int]$Matches[3]

                # If HEAD is exactly the tag, reuse the version; otherwise bump patch
                $ExactTag = git tag --points-at HEAD | Where-Object { $_ -eq $LatestTag }
                if ($ExactTag) {
                    $NewVersion = "$Major.$Minor.$Patch"
                    Write-Host "HEAD is tagged $LatestTag — using version: $NewVersion"
                } else {
                    $Patch++
                    $NewVersion = "$Major.$Minor.$Patch"
                    Write-Host "Commits after $LatestTag — bumped to: $NewVersion"
                }
            }
            else
            {
                try
                {
                    $(Invoke-WebRequest "https://www.nuget.org/api/v2/package/ANcpLua.NET.Sdk/").BaseResponse.RequestMessage.RequestUri -match "ANcpLua\.net\.sdk\.(\d+)\.(\d+)\.(\d+)\.nupkg"
                    $Major = [int]$Matches.1
                    $Minor = [int]$Matches.2
                    $Patch = [int]$Matches.3 + 1
                    $NewVersion = "$Major.$Minor.$Patch"
                }
                catch
                {
                    $NewVersion = "1.1.3"
                }
            }

            Write-Host "New version: $NewVersion"
            "package_version=$NewVersion" >> $env:GITHUB_OUTPUT

  create_nuget:
    # lint_config must land BEFORE packing. It used to run in parallel, so on a drift run
    # it would commit the regenerated src/Config/*.editorconfig while this job packed the
    # stale ones — and deploy would publish that stale package. The self-heal commit is
    # pushed with GITHUB_TOKEN, which by design triggers no new workflow run, so nothing
    # would have re-packed it either: the fix would sit on main unreleased.
    needs: [compute_version, lint_config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Take the branch tip so a self-heal commit from lint_config is packed. This must
          # cover workflow_dispatch as well as push: deploy's gate is `github.ref ==
          # 'refs/heads/main'`, which a manual dispatch against main also satisfies, so
          # restricting this to push would still let a dispatch publish stale config.
          # Empty on pull_request to keep the default merge-ref checkout, which fork PRs
          # depend on (their head branch does not exist in this repo).
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - name: Create artifacts directory
        run: New-Item -ItemType Directory -Force -Path artifacts
      - run: ./build.ps1 -Version ${{ needs.compute_version.outputs.package_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 3
          path: "${{ env.NUGET_DIRECTORY }}/*.nupkg"

  test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    needs: [create_nuget, compute_version]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'
      - run: Get-ChildItem "${{ env.NUGET_DIRECTORY }}/*" -Recurse
      - run: dotnet --info
      - run: dotnet nuget locals all --clear
      # CheckEnforcement is for SDK consumers, not the SDK repo itself
      # (SDK repo uses Microsoft.NET.Sdk, can't dogfood ANcpLua.NET.Sdk)
      - run: dotnet test --project tests/ANcpLua.Sdk.Tests/ANcpLua.Sdk.Tests.csproj --report-xunit-trx --report-github --results-directory test_results
        env:
            CI: true
            NUGET_DIRECTORY: ${{ env.NUGET_DIRECTORY }}
            PACKAGE_VERSION: ${{ needs.compute_version.outputs.package_version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test_results_${{ matrix.runs-on }}
          path: test_results

  deploy:
    runs-on: ubuntu-latest
    needs: [create_nuget, lint_config, test, compute_version]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          # Match create_nuget: "Must Publish Packages" below diffs HEAD against the previous
          # tag over src/**, so it must see any self-heal commit too. At the run SHA, a release
          # whose only change was a regenerated config would be judged "no changes" and skipped.
          ref: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nuget
          path: ${{ env.NUGET_DIRECTORY }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Must Publish Packages
        id: has_changes
        run: |
          # When HEAD is tagged (release commit), diff against the PREVIOUS tag
          # to detect changes. Without this, git diff $tag HEAD is always empty.
          $ExactTag = git describe --tags --exact-match HEAD 2>$null
          if ($ExactTag) {
            Write-Host "HEAD is tagged: $ExactTag — finding previous tag"
            $PreviousTag = git describe --tags --abbrev=0 "$ExactTag~1" 2>$null
          } else {
            $PreviousTag = git describe --tags --abbrev=0 2>$null
          }

          if ($PreviousTag) {
            Write-Host "Previous tag: $PreviousTag"
            # tests/**/* is included so test-only fixes (e.g. the CA1852 Sample class seal
            # for v3.3.1) still count as publishable changes — the earlier omission meant a
            # green CI silently skipped publish with no signal.
            # templates/**/* is included so dotnet-new template content edits (consumed at
            # pack time by ANcpLua.NET.Sdk.Templates) trigger a new Templates package.
            $Changes = git diff --name-only $PreviousTag HEAD -- '*.nuspec' 'src/**/*' 'tests/**/*' 'templates/**/*'
          } else {
            Write-Host "No previous tag found, checking all files"
            $Changes = $true
          }

          if ($Changes) {
            Write-Host "Changes: $Changes"
            echo "has_changes=true" >> $env:GITHUB_OUTPUT
            exit 0
          } else {
            Write-Host "No changes detected in .nuspec, src/, tests/, or templates/ files"
            echo "has_changes=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

      - name: Authenticate to NuGet (trusted publishing)
        if: steps.has_changes.outputs.has_changes == 'true'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        if: steps.has_changes.outputs.has_changes == 'true'
        run: |
          Write-Host "Publishing to NuGet.org"
          $files = Get-ChildItem "${{ env.NUGET_DIRECTORY }}/*" -Recurse -Include *.nupkg
          foreach ($file in $files) {
              Write-Host "Pushing: $($file.Name)"
              & dotnet nuget push "$($file.FullName)" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }

      - name: Create GitHub release
        if: steps.has_changes.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.compute_version.outputs.package_version }}
        run: |
          # Tag name matches the convention used by the human/CLI (v3.3.1, not 3.3.1).
          # Older runs used the bare "$VERSION" which created a second tag alongside the
          # pre-existing vX.Y.Z — see repo tags page for the historical duplicates.
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
